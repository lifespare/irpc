name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      listening:
        description: 'Try "Listening to" instead of "Playing" (experimental)'
        type: boolean
        default: false
      background_audio:
        description: 'Enable the audio background mode'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages, patch DiscordSocialKit, build archive
        env:
          LISTENING: ${{ inputs.listening }}
        run: |
          set -eo pipefail

          # Find workspace or project
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            KIND="-workspace"
            NAME="$(ls -d *.xcworkspace | head -n1)"
            SCHEME="$(xcodebuild -list -json -workspace "$NAME" | jq -r '.workspace.schemes[0]')"
          else
            KIND="-project"
            NAME="$(ls -d *.xcodeproj | head -n1)"
            SCHEME="$(xcodebuild -list -json -project "$NAME" | jq -r '.project.schemes[0]')"
          fi
          echo "Using $KIND $NAME, scheme $SCHEME"

          # 1) Download Swift packages into ./SourcePackages
          xcodebuild -resolvePackageDependencies \
            $KIND "$NAME" \
            -clonedSourcePackagesDirPath SourcePackages

          # Swift checks packages out as read-only, so unlock them before patching
          chmod -R u+w SourcePackages/checkouts

          # 2) Patch DiscordSocialKit: look up cover art via Apple's public iTunes
          #    Search API (no MusicKit token needed), fall back to the passed-in link
          python3 - <<'PY'
          import glob, os, sys

          files = glob.glob("SourcePackages/checkouts/DiscordSocialKit/Sources/**/*.swift", recursive=True)

          needle1 = "if let cachedArtwork = artworkCache[id] {"
          patch1 = (
              "if artworkCache[id] == nil {\n"
              "\t\t\tif let itunesArtwork = await fetchITunesArtwork(title: title, artist: artist) {\n"
              "\t\t\t\tartworkCache[id] = itunesArtwork\n"
              "\t\t\t} else if let passedArtwork = artworkURL, validateAssetURL(passedArtwork) {\n"
              "\t\t\t\tartworkCache[id] = passedArtwork\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t\tif let cachedArtwork = artworkCache[id] {"
          )

          needle2 = "private func validateAssetURL(_ url: URL) -> Bool {"
          helper = r'''private func fetchITunesArtwork(title: String, artist: String) async -> URL? {
                  var components = URLComponents(string: "https://itunes.apple.com/search")
                  components?.queryItems = [
                      URLQueryItem(name: "term", value: "\(title) \(artist)"),
                      URLQueryItem(name: "media", value: "music"),
                      URLQueryItem(name: "entity", value: "song"),
                      URLQueryItem(name: "limit", value: "1"),
                  ]
                  guard let searchURL = components?.url else { return nil }
                  do {
                      let (data, _) = try await URLSession.shared.data(from: searchURL)
                      guard
                          let json = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let results = json["results"] as? [[String: Any]],
                          let first = results.first,
                          let small = first["artworkUrl100"] as? String
                      else {
                          print("iTunes artwork lookup: no result for \(title) by \(artist)")
                          return nil
                      }
                      let big = small.replacingOccurrences(of: "100x100bb", with: "600x600bb")
                      guard let url = URL(string: big), validateAssetURL(url) else { return nil }
                      print("iTunes artwork found: \(url)")
                      return url
                  } catch {
                      print("iTunes artwork lookup failed: \(error)")
                      return nil
                  }
              }

              '''

          listening = os.environ.get("LISTENING", "false") == "true"
          print("Listening type enabled:", listening)

          done = False
          for f in files:
              s = open(f, encoding="utf-8").read()
              if needle1 in s and needle2 in s:
                  s = s.replace(needle1, patch1, 1)
                  s = s.replace(needle2, helper + needle2, 1)
                  if listening:
                      # Show "Listening to Apple Music" instead of "Playing"
                      s = s.replace("Discord_ActivityTypes_Playing", "Discord_ActivityTypes_Listening")
                      # The package cuts the name "Apple Music" down to 4 bytes; use the full length
                      s = s.replace("nameStr.size = Int(Int32(4))", 'nameStr.size = Int("Apple Music".utf8.count)')
                  open(f, "w", encoding="utf-8").write(s)
                  print("Patched", f)
                  done = True
          if not done:
              sys.exit("ERROR: patch target not found in DiscordSocialKit")
          PY

          # 3) Build using the patched packages
          xcodebuild archive \
            $KIND "$NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        env:
          BG_AUDIO: ${{ inputs.background_audio }}
        run: |
          set -eo pipefail
          APP="$(ls -d build/app.xcarchive/Products/Applications/*.app | head -n1)"
          PLIST="$APP/Info.plist"

          if [ "$BG_AUDIO" = "true" ]; then
            # Turn on the "audio" background mode so iOS keeps the app alive
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
            echo "Background modes now set to:"
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          else
            echo "Background audio mode left off"
          fi

          mkdir Payload
          cp -R "$APP" Payload/
          zip -r iRPC.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iRPC-ipa
          path: iRPC.ipa
