name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          set -eo pipefail

          # Find workspace or project
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            KIND="-workspace"
            NAME="$(ls -d *.xcworkspace | head -n1)"
            SCHEME="$(xcodebuild -list -json -workspace "$NAME" | jq -r '.workspace.schemes[0]')"
          else
            KIND="-project"
            NAME="$(ls -d *.xcodeproj | head -n1)"
            SCHEME="$(xcodebuild -list -json -project "$NAME" | jq -r '.project.schemes[0]')"
          fi
          echo "Using $KIND $NAME, scheme $SCHEME"

          xcodebuild archive \
            $KIND "$NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -r iRPC.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iRPC-ipa
          path: iRPC.ipa
