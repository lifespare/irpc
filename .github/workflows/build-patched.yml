name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      discord_app_id:
        description: 'Your own Discord Application ID (digits only). Leave empty to keep the original one.'
        type: string
        default: ''
      listening:
        description: 'Show "Listening to Apple Music" with progress bar'
        type: boolean
        default: true
      small_badge:
        description: 'Add the small Apple Music badge on the cover (needs an art asset named applemusic)'
        type: boolean
        default: false
      debug_banner:
        description: 'Show a banner in the app with the latest Discord status and timestamps'
        type: boolean
        default: true
      background_audio:
        description: 'Enable the audio background mode'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve packages, patch code, build archive
        env:
          APP_ID: ${{ inputs.discord_app_id }}
          LISTENING: ${{ inputs.listening }}
          SMALL_BADGE: ${{ inputs.small_badge }}
          DEBUG_BANNER: ${{ inputs.debug_banner }}
        run: |
          set -eo pipefail

          # Find workspace or project
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            KIND="-workspace"
            NAME="$(ls -d *.xcworkspace | head -n1)"
            SCHEME="$(xcodebuild -list -json -workspace "$NAME" | jq -r '.workspace.schemes[0]')"
          else
            KIND="-project"
            NAME="$(ls -d *.xcodeproj | head -n1)"
            SCHEME="$(xcodebuild -list -json -project "$NAME" | jq -r '.project.schemes[0]')"
          fi
          echo "Using $KIND $NAME, scheme $SCHEME"

          # 1) Download Swift packages into ./SourcePackages
          xcodebuild -resolvePackageDependencies \
            $KIND "$NAME" \
            -clonedSourcePackagesDirPath SourcePackages

          # Swift checks packages out as read-only, so unlock them before patching
          chmod -R u+w SourcePackages/checkouts

          # 2) Patch code
          python3 - <<'PY'
          import glob, os, re, sys

          def sub(s, old, new, label, count=1):
              if old not in s:
                  print("WARNING: not found:", label)
                  return s
              print("OK:", label)
              return s.replace(old, new, count)

          app_id = os.environ.get("APP_ID", "").strip()
          listening = os.environ.get("LISTENING", "false") == "true"
          small_badge = os.environ.get("SMALL_BADGE", "false") == "true"
          banner = os.environ.get("DEBUG_BANNER", "false") == "true"
          print("Custom app ID:", app_id or "(none, keeping original)")
          print("Listening:", listening, "| Small badge:", small_badge, "| Banner:", banner)

          # ---------- Replace the Discord application ID everywhere ----------
          OLD_ID = "1370062110272520313"
          if app_id:
              if not re.fullmatch(r"[0-9]{15,25}", app_id):
                  sys.exit("ERROR: the Discord Application ID must be digits only")
              changed = []
              for root, dirs, fnames in os.walk("."):
                  dirs[:] = [d for d in dirs if d not in (".git", "SourcePackages", "build", "Payload")]
                  for fn in fnames:
                      if fn.endswith((".swift", ".plist", ".pbxproj", ".xcconfig", ".entitlements", ".xcscheme")):
                          p = os.path.join(root, fn)
                          try:
                              txt = open(p, encoding="utf-8").read()
                          except Exception:
                              continue
                          new = txt.replace("1_370_062_110_272_520_313", app_id).replace(OLD_ID, app_id)
                          if new != txt:
                              open(p, "w", encoding="utf-8").write(new)
                              changed.append(p)
              print("App ID replaced in:", changed)
              if not changed:
                  print("WARNING: the old app ID was not found in any file")

          # ---------- DiscordSocialKit ----------
          files = glob.glob("SourcePackages/checkouts/DiscordSocialKit/Sources/**/*.swift", recursive=True)

          needle1 = "if let cachedArtwork = artworkCache[id] {"
          patch1 = (
              "if artworkCache[id] == nil {\n"
              "\t\t\tif let itunesArtwork = await fetchITunesArtwork(id: id, title: title, artist: artist) {\n"
              "\t\t\t\tartworkCache[id] = itunesArtwork\n"
              "\t\t\t} else if let passedArtwork = artworkURL, validateAssetURL(passedArtwork) {\n"
              "\t\t\t\tartworkCache[id] = passedArtwork\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t\tif let cachedArtwork = artworkCache[id] {"
          )

          needle2 = "private func validateAssetURL(_ url: URL) -> Bool {"
          helper = r'''private func fetchITunesArtwork(id: String, title: String, artist: String) async -> URL? {
                  var components = URLComponents(string: "https://itunes.apple.com/search")
                  components?.queryItems = [
                      URLQueryItem(name: "term", value: "\(title) \(artist)"),
                      URLQueryItem(name: "media", value: "music"),
                      URLQueryItem(name: "entity", value: "song"),
                      URLQueryItem(name: "limit", value: "1"),
                  ]
                  guard let searchURL = components?.url else { return nil }
                  do {
                      let (data, _) = try await URLSession.shared.data(from: searchURL)
                      guard
                          let json = try JSONSerialization.jsonObject(with: data) as? [String: Any],
                          let results = json["results"] as? [[String: Any]],
                          let first = results.first,
                          let small = first["artworkUrl100"] as? String
                      else {
                          print("iTunes artwork lookup: no result for \(title) by \(artist)")
                          return nil
                      }
                      if let album = first["collectionName"] as? String {
                          albumCache[id] = album
                      }
                      let big = small.replacingOccurrences(of: "100x100bb", with: "600x600bb")
                      guard let url = URL(string: big), validateAssetURL(url) else { return nil }
                      print("iTunes artwork found: \(url)")
                      return url
                  } catch {
                      print("iTunes artwork lookup failed: \(error)")
                      return nil
                  }
              }

              '''

          extras = r'''private var albumCache: [String: String] = [:]

              private var reconnectTask: Task<Void, Never>?

              func scheduleReconnect() {
                  reconnectTask?.cancel()
                  reconnectTask = Task { @MainActor in
                      try? await Task.sleep(nanoseconds: 10_000_000_000)
                      guard !Task.isCancelled, !self.isAuthenticated else { return }
                      print("Reconnecting to Discord...")
                      self.lastPresenceStatus = "Reconnecting to Discord at " + Date().formatted(date: .omitted, time: .standard)
                      await self.setupWithExistingToken()
                  }
              }

              '''

          stamp = 'Date().formatted(date: .omitted, time: .standard)'

          done = False
          for f in files:
              s = open(f, encoding="utf-8").read()
              if needle1 in s and needle2 in s:
                  s = s.replace(needle1, patch1, 1)
                  s = s.replace(needle2, helper + needle2, 1)

                  # Album name as the third line
                  s = sub(s, r'makeDiscordString(from: "\(title) by \(artist)")',
                          r'makeDiscordString(from: albumCache[id] ?? "\(title) by \(artist)")',
                          "album line", count=-1)

                  if listening:
                      s = s.replace("Discord_ActivityTypes_Playing", "Discord_ActivityTypes_Listening")
                      s = sub(s, "nameStr.size = Int(Int32(4))",
                              'nameStr.size = Int("Apple Music".utf8.count)', "full name length")

                  if small_badge:
                      s = sub(s, "Discord_Activity_SetAssets(&activity, &assets)",
                              'var smallImageStr = makeDiscordString(from: "applemusic")\n'
                              '\t\tvar smallTextStr = makeDiscordString(from: "Apple Music")\n'
                              '\t\tDiscord_ActivityAssets_SetSmallImage(&assets, &smallImageStr)\n'
                              '\t\tDiscord_ActivityAssets_SetSmallText(&assets, &smallTextStr)\n'
                              '\t\tDiscord_Activity_SetAssets(&activity, &assets)',
                              "small badge")

                  s = sub(s, "@Published public private(set) var isAuthorizing = false",
                          "@Published public private(set) var isAuthorizing = false\n\t@Published public var lastPresenceStatus: String? = nil",
                          "status variable")

                  s = sub(s, "public func authorize() {", extras + "public func authorize() {", "reconnect helper")

                  s = sub(s, 'print("❌ Client disconnected")',
                          'print("❌ Client disconnected")\n\t\t\t\tmanager.lastPresenceStatus = "Disconnected from Discord at " + ' + stamp + '\n\t\t\t\tmanager.scheduleReconnect()',
                          "reconnect on disconnect")
                  s = sub(s, r'manager.handleError("Connection error \(error): \(errorDetail)")',
                          r'manager.handleError("Connection error \(error): \(errorDetail)")' + '\n\t\t\t\tmanager.lastPresenceStatus = "Connection error at " + ' + stamp + '\n\t\t\t\tmanager.scheduleReconnect()',
                          "reconnect on error")

                  s = sub(s, 'print("✅ Rich Presence updated successfully!")',
                          'print("✅ Rich Presence updated successfully!")\n\t\t\t\t\t\tTask { @MainActor in context.manager.lastPresenceStatus = "Presence accepted at " + ' + stamp + ' }',
                          "success callback")
                  s = sub(s, r'print("❌ Rich Presence update failed: \(errorMessage)")',
                          r'print("❌ Rich Presence update failed: \(errorMessage)")' + '\n\t\t\t\t\t\t\tTask { @MainActor in context.manager.lastPresenceStatus = "Discord rejected it: " + errorMessage }',
                          "error callback")

                  open(f, "w", encoding="utf-8").write(s)
                  print("Patched", f)
                  done = True
          if not done:
              sys.exit("ERROR: patch target not found in DiscordSocialKit")

          # ---------- BackgroundController (keep-alive fixes) ----------
          bg = "iRPC/BackgroundController.swift"
          if os.path.exists(bg):
              b = open(bg, encoding="utf-8").read()
              b, n1 = re.subn(
                  r'beginBackgroundTask\(withName: "RPCBackgroundTask"\)\s*\{\s*self\.stop\(\)\s*\}',
                  'beginBackgroundTask(withName: "RPCBackgroundTask") {\n'
                  '            if self.backgroundTaskID != .invalid {\n'
                  '                UIApplication.shared.endBackgroundTask(self.backgroundTaskID)\n'
                  '                self.backgroundTaskID = .invalid\n'
                  '            }\n'
                  '        }',
                  b)
              print("Background task handler patched:", n1)
              b, n2 = re.subn(
                  r'guard let optionsValue = userInfo\[AVAudioSessionInterruptionOptionKey\] as\? UInt else \{\s*return\s*\}',
                  'let optionsValue = (userInfo[AVAudioSessionInterruptionOptionKey] as? UInt) ?? 0',
                  b)
              print("Interruption options patched:", n2)
              if "if options.contains(.shouldResume) {" in b:
                  b = b.replace("if options.contains(.shouldResume) {", "if options.contains(.shouldResume) || true {", 1)
                  print("shouldResume check relaxed")
              open(bg, "w", encoding="utf-8").write(b)
          else:
              print("WARNING: BackgroundController.swift not found at", bg)

          # ---------- ContentView banner ----------
          if banner:
              cv = "iRPC/ContentView.swift"
              if os.path.exists(cv):
                  t = open(cv, encoding="utf-8").read()
                  old = '.navigationTitle("iRPC")'
                  new = old + '''
                      .safeAreaInset(edge: .bottom) {
                          if let status = discord.lastPresenceStatus {
                              Text(status)
                                  .font(.caption)
                                  .padding(8)
                                  .frame(maxWidth: .infinity)
                                  .background(.ultraThinMaterial)
                          }
                      }'''
                  if old in t:
                      open(cv, "w", encoding="utf-8").write(t.replace(old, new, 1))
                      print("Banner added to ContentView")
                  else:
                      print("WARNING: could not add banner (navigationTitle not found)")
              else:
                  print("WARNING: ContentView.swift not found at", cv)
          PY

          # 3) Build using the patched packages
          xcodebuild archive \
            $KIND "$NAME" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/app.xcarchive \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        env:
          BG_AUDIO: ${{ inputs.background_audio }}
        run: |
          set -eo pipefail
          APP="$(ls -d build/app.xcarchive/Products/Applications/*.app | head -n1)"
          PLIST="$APP/Info.plist"

          if [ "$BG_AUDIO" = "true" ]; then
            # Turn on the "audio" background mode so iOS keeps the app alive
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
            echo "Background modes now set to:"
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"
          else
            echo "Background audio mode left off"
          fi

          mkdir Payload
          cp -R "$APP" Payload/
          zip -r iRPC.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iRPC-ipa
          path: iRPC.ipa
